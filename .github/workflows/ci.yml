name: SDK checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:verify

  runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['16.20.2', '18.0.0', '20.0.0', '22.0.0', '24.9.0']
    steps:
      - uses: actions/checkout@v4
      # Build with development tools, then run the untransformed artifact on
      # the target runtime. No Fastify or node:test dependency in this runner.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm pack
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/probe-node-compatibility.js
      - run: npm exec -- node scripts/verify-runtime-install.js
